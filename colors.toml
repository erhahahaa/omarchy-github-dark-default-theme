# GitHub Dark Default — Omarchy 4 (Quattro) theme
# Palette from GitHub Primer primitives / primer/github-vscode-theme (dark default)

mode = "dark"

accent = "#4493f8"
selection = "#1e4273"
muted = "#6e7681"

# Neutral ramp, darkest -> lightest
background = "#0d1117"
dark_background = "#010409"
darker_background = "#000000"
lighter_background = "#161b22"

foreground = "#e6edf3"
dark_foreground = "#7d8590"
light_foreground = "#f0f6fc"
bright_foreground = "#ffffff"

# Named colors
red = "#ff7b72"
yellow = "#d29922"
orange = "#f0883e"
green = "#3fb950"
cyan = "#39c5cf"
blue = "#58a6ff"
magenta = "#bc8cff"
brown = "#9e6a03"

bright_red = "#ffa198"
bright_yellow = "#e3b341"
bright_green = "#56d364"
bright_cyan = "#56d4dd"
bright_blue = "#79c0ff"
bright_magenta = "#d2a8ff"

# Window borders. These also drive the shell's popups, menus, notifications,
# polkit prompt and lock screen. Inactive is Primer's border.default (#30363d).
hyprland_active_border = "rgba(4493f8ee) rgba(a371f7ee) 45deg"
hyprland_inactive_border = "rgba(30363daa)"

# Explicit ANSI palette. Omarchy derives color0 from background and color7 from
# foreground, so the exact GitHub terminal endpoints live in extras/ instead.
color0 = "#484f58"
color1 = "#ff7b72"
color2 = "#3fb950"
color3 = "#d29922"
color4 = "#58a6ff"
color5 = "#bc8cff"
color6 = "#39c5cf"
color7 = "#b1bac4"
color8 = "#6e7681"
color9 = "#ffa198"
color10 = "#56d364"
color11 = "#e3b341"
color12 = "#79c0ff"
color13 = "#d2a8ff"
color14 = "#56d4dd"
color15 = "#f0f6fc"
